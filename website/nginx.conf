server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirigir la raíz a /docs/
    location = / {
        return 301 /docs/;
    }

    # Redirigir /docs a /docs/
    location = /docs {
        return 301 /docs/;
    }

    # Manejar rutas de documentación bajo /docs/
    location /docs/ {
        try_files $uri $uri/ $uri.html /docs/index.html;
    }

    # Cacheo de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
